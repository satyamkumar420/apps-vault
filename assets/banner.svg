<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="glowCyan" cx="15%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="85%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 52px; letter-spacing: -1.5px; fill: url(#titleGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; letter-spacing: 0.3px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #f1f5f9; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 12px; fill: #94a3b8; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #38bdf8; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>

  <!-- Ambient Glows -->
  <rect width="1200" height="420" rx="20" fill="url(#glowCyan)"/>
  <rect width="1200" height="420" rx="20" fill="url(#glowPurple)"/>
  <rect width="1200" height="420" rx="20" fill="url(#glowEmerald)"/>

  <!-- Geometric Grid Pattern Overlay -->
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- TOP BADGES -->
  <g transform="translate(60, 48)">
    <!-- Badge 1: Windows Silent -->
    <g>
      <rect width="180" height="30" rx="15" fill="#0078d4" fill-opacity="0.15" stroke="#0078d4" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="16" cy="15" r="4" fill="#0078d4"/>
      <text x="28" y="19" class="badge-text" fill="#60a5fa">Windows MotW Strip</text>
    </g>

    <!-- Badge 2: Linux Multiarch -->
    <g transform="translate(192, 0)">
      <rect width="165" height="30" rx="15" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="16" cy="15" r="4" fill="#facc15"/>
      <text x="28" y="19" class="badge-text" fill="#fde047">Linux amd64 · arm64</text>
    </g>

    <!-- Badge 3: macOS Universal -->
    <g transform="translate(369, 0)">
      <rect width="160" height="30" rx="15" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="16" cy="15" r="4" fill="#ec4899"/>
      <text x="28" y="19" class="badge-text" fill="#f472b6">macOS M1-M4 · Intel</text>
    </g>

    <!-- Badge 4: Android Release -->
    <g transform="translate(541, 0)">
      <rect width="145" height="30" rx="15" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="16" cy="15" r="4" fill="#10b981"/>
      <text x="28" y="19" class="badge-text" fill="#6ee7b7">Android Releases</text>
    </g>
  </g>

  <!-- MAIN TITLE & TAGLINE -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" class="title">📦 APPS VAULT — SATYAM KUMAR</text>
    <text x="0" y="40" class="subtitle">Central Binary Release Hub · Cross-Platform Direct Downloads &amp; One-Click Deployment</text>
  </g>

  <!-- FEATURE CARDS (BOTTOM) -->
  <!-- Card 1: Windows 1-Liner -->
  <g transform="translate(60, 245)">
    <rect width="260" height="115" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <circle cx="28" cy="35" r="8" fill="#38bdf8" fill-opacity="0.2"/>
    <circle cx="28" cy="35" r="4" fill="#38bdf8"/>
    <text x="48" y="39" class="card-title">Windows One-Liner</text>
    <text x="28" y="68" class="card-sub">Auto MotW Strip · No Blue Screen</text>
    <text x="28" y="93" class="mono">irm .../install.ps1 | iex</text>
  </g>

  <!-- Card 2: Linux Daemon -->
  <g transform="translate(332, 245)">
    <rect width="260" height="115" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <circle cx="28" cy="35" r="8" fill="#f59e0b" fill-opacity="0.2"/>
    <circle cx="28" cy="35" r="4" fill="#f59e0b"/>
    <text x="48" y="39" class="card-title">Linux / macOS Curl</text>
    <text x="28" y="68" class="card-sub">Zero Dependencies · Standalone</text>
    <text x="28" y="93" class="mono">curl -sSL ... -o agent &amp;&amp; run</text>
  </g>

  <!-- Card 3: Remote Manager Agent -->
  <g transform="translate(604, 245)">
    <rect width="260" height="115" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <circle cx="28" cy="35" r="8" fill="#a855f7" fill-opacity="0.2"/>
    <circle cx="28" cy="35" r="4" fill="#a855f7"/>
    <text x="48" y="39" class="card-title">Remote Manager Agent</text>
    <text x="28" y="68" class="card-sub">Cross-Platform v2.0.0 Silent</text>
    <text x="28" y="93" class="mono">STATUS: 🟢 COMPILED &amp; READY</text>
  </g>

  <!-- Card 4: Android APKs -->
  <g transform="translate(876, 245)">
    <rect width="264" height="115" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <circle cx="28" cy="35" r="8" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="28" cy="35" r="4" fill="#10b981"/>
    <text x="48" y="39" class="card-title">Mobile APK Distribution</text>
    <text x="28" y="68" class="card-sub">Minor Monitor v1.2.7 Release</text>
    <text x="28" y="93" class="mono">TYPE: 📱 SIGNED APK</text>
  </g>

  <!-- Decorative Corner Waveform Lines -->
  <path d="M 980 50 Q 1040 10 1100 70 T 1150 130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>
  <path d="M 960 80 Q 1020 40 1080 100 T 1140 160" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.25"/>
</svg>
